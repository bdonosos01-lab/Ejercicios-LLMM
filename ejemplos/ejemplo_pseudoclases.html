<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclases CSS</title>
    <link rel="stylesheet" href="css/pseudoclases.css">
</head>
<body>
    <div>
        <h2>Lista 1</h2>
        <ul>
            <li>Elemento 1</li> <!-- first-child -->
            <li>Elemento 2</li> <!-- nth-child(2) y not(first/last) -->
            <li>Elemento 3</li> <!-- last-child -->
        </ul>
    </div>

    <div>
        <h2>Lista 2 (solo un elemento)</h2>
        <p>Único párrafo</p> <!-- only-child -->
    </div>

    <div>
        <h2>Lista 3</h2>
        <ul>
            <li>Elemento A</li> <!-- first-child -->
            <li>Elemento B</li> <!-- nth-child(2) y not(first/last) -->
            <li>Elemento C</li> <!-- last-child -->
            <li>Elemento D</li> <!-- not(first/last) -->
        </ul>
    </div>
</body>
</html>
