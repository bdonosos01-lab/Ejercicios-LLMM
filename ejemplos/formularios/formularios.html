<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>IES Augustóbriga</title>
    <meta name="desription" content="Página web del IES Augustóbriga" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <script src="js/script..js"></script>
    <table style="border: 3px solid grey; margin: auto; background-color: black;">
        <caption>
            <h1>Formularios</h1>
        </caption>
        <form action="manejador.html" enctype="multipart/form-data" method="post"></form>
        
        <tr>
            <td>
                <p>
                    <label class="labels" for="nombre">Nombre: </label>
                    <input class="inputs" type="text" name="nombre" maxlength="4">  
                </p>

                <p>
                    <label class="labels">
                        <input type="radio" name="etapa" id="menos20" value="niñito" checked>
                        Menos De 20 Años
                    </label>
                </p>

                <p>
                    <label class="labels">
                        <input type="radio" name="etapa" id="mas20" value="adulto">
                        Más de 20 Años
                    </label>
                </p>

                <p>
                    <label class="labels">
                        <input type="radio" name="etapa" id="500" value="nose">
                        Más de 500 Años
                    </label>
                </p>

                <p>
                    <label class="labels">
                        <input type="radio" name="etapa" id="1500" value="mayor">
                        Más de 1500 Años
                    </label>
                </p>
            </td>
        </tr>
    </table>
</body>

</html>
